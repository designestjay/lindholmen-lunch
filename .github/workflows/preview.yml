name: Preview

# Zip the built page so a pull request has a downloadable preview.
# Production Pages still deploys only from main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Friday page
        run: python generate_html.py --day friday

      - name: Zip docs
        run: python -c "import shutil; shutil.make_archive('docs-preview', 'zip', 'docs')"

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs-preview.zip
          if-no-files-found: error
