name: Update Lunch Data and Deploy

# GitHub Pages deploys from the main branch /docs folder.
on:
  schedule:
    # Off-peak UTC slots, never at :00. Stockholm is UTC+1 in winter and UTC+2 in summer,
    # so the first run is 06:07 or 07:07 local and the last is 09:07 or 10:07 local.
    - cron: '7 5 * * 1-5'
    - cron: '37 6 * * 1-5'
    - cron: '7 8 * * 1-5'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# One scrape at a time. The three weekday runs queue instead of overlapping.
concurrency:
  group: lindholmen-lunch-daily
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Record job start
      run: echo "LUNCH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: pytest -q -m "not browser"
      env:
        CI: "true"

    - name: Setup Chrome (using pre-installed)
      run: |
        echo "Using GitHub Actions pre-installed Chrome"
        google-chrome --version || echo "Chrome not available - some scrapers may fail"

    - name: Get current day
      id: get-day
      run: |
        DAY=$(python -c "from utils.utils import get_today_english; print(get_today_english().lower())")
        echo "day=$DAY" >> "$GITHUB_OUTPUT"
        echo "Current day: $DAY"

    - name: Scrape lunch data for current day with error handling
      id: scrape
      timeout-minutes: 10
      run: |
        DAY="${{ steps.get-day.outputs.day }}"
        if [ "$DAY" = "saturday" ] || [ "$DAY" = "sunday" ]; then
          echo "Weekend. Skipping scrape."
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skipped=false" >> "$GITHUB_OUTPUT"
        echo "Scraping data for: $DAY"
        for attempt in 1 2 3; do
          echo "Attempt $attempt of 3..."
          if python main.py --day "$DAY" --refresh; then
            echo "Scraping successful on attempt $attempt"
            break
          else
            echo "Scraping failed on attempt $attempt"
            if [ "$attempt" -eq 3 ]; then
              echo "All scraping attempts failed. Checking if we have existing data..."
              if [ -f "data/lunch_data_${DAY}.json" ]; then
                echo "Using existing data from previous run"
              else
                echo "No existing data found. Scraping completely failed."
                exit 1
              fi
            else
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          fi
        done

    - name: Generate fresh HTML page
      run: |
        DAY="${{ steps.get-day.outputs.day }}"
        if [ "${{ steps.scrape.outputs.skipped }}" = "true" ]; then
          echo "Rendering Friday's page for the weekend."
          python generate_html.py --day friday
        else
          echo "Generating fresh HTML page for $DAY"
          python generate_html.py --day "$DAY"
        fi

    - name: Browser smoke
      run: pytest -q -m browser

    - name: Health report
      id: health
      if: steps.scrape.outputs.skipped != 'true'
      env:
        LUNCH_DAY: ${{ steps.get-day.outputs.day }}
        LUNCH_SCHEDULE: ${{ github.event.schedule }}
        LUNCH_STARTED_AT: ${{ env.LUNCH_STARTED_AT }}
      run: python -m utils.scrape_health

    - name: Open or update health issue
      if: steps.health.outputs.open_issue == 'true'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const date = ${{ toJSON(steps.health.outputs.report_date) }};
          const title = `Scrape health ${date}`;
          const { owner, repo } = context.repo;
          const issues = await github.paginate(github.rest.issues.listForRepo, {
            owner, repo, state: "open", per_page: 100,
          });
          const existing = issues.find((issue) => issue.title === title);
          const body = [
            "Fresh coverage on the last scheduled run was under 50%.",
            "The restaurant table is in the job summary for this run.",
          ].join("\n\n");
          if (existing) {
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number, body,
            });
          } else {
            await github.rest.issues.create({ owner, repo, title, body });
          }

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git pull origin main --no-edit || echo "Pull failed, continuing..."
        git add data/ docs/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update: ${{ steps.get-day.outputs.day }} lunch data $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push origin main; then
              echo "Push successful on attempt $i"
              break
            else
              echo "Push failed on attempt $i, trying to pull and retry..."
              git pull origin main --no-edit --strategy-option=ours || echo "Pull failed"
              if [ "$i" -eq 3 ]; then
                echo "All push attempts failed"
                exit 1
              fi
            fi
          done
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/

    - name: Fail when coverage is under half
      if: steps.health.outputs.fail == 'true'
      run: |
        echo "Fresh coverage is under 50% on the last scheduled run."
        exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: scrape-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
